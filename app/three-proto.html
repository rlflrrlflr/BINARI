<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<meta name="robots" content="noindex" />
<title>수호신 3D 시험판</title>
<style>
  :root { --bg:#d9d5ca; --ink:#191308; --mute:#6b6257; --line:rgba(25,19,8,.14); }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
  body { display:flex; flex-direction:column; overflow:hidden; }
  #stage { flex:1; position:relative; min-height:0; touch-action:none; }
  #stage canvas { display:block; width:100%; height:100%; }
  .tabs { display:flex; gap:6px; padding:10px 16px 0; }
  .tabs button { flex:1; padding:9px 0; border:1px solid var(--line); background:transparent;
    border-radius:999px; font:inherit; color:var(--mute); }
  .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  .dock { padding:10px 16px 16px; display:flex; flex-direction:column; gap:8px; }
  textarea { width:100%; box-sizing:border-box; resize:none; border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; font:inherit; background:#fffdf9; color:var(--ink); }
  .row { display:flex; gap:8px; }
  .row button { flex:1; padding:12px 0; border:0; border-radius:14px; background:var(--ink); color:#fff; font:inherit; }
  .row button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .hint { color:var(--mute); font-size:12.5px; text-align:center; }
  #fps { position:absolute; top:8px; right:12px; font-size:11px; color:var(--mute); }
  #mood { position:absolute; top:8px; left:12px; font-size:11px; color:var(--mute); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
  <div class="tabs"><button id="tPan" class="on">판결</button><button id="tGy">곁</button></div>
  <div id="stage"><span id="mood"></span><span id="fps"></span></div>
  <div class="dock" id="dPan">
    <textarea id="q" rows="2" maxlength="100" placeholder="고민을 적어 보세요 (예: 지금 고백해도 될까?)"></textarea>
    <div class="hint">글자를 치면 눈이 따라오고, 낱말에 따라 표정이 바뀝니다 · 수호신을 끌어 돌려 보세요</div>
  </div>
  <div class="dock" id="dGy" hidden>
    <div class="row"><button id="add">친구 초대 받음 (+1)</button><button class="ghost" id="clear">비우기</button></div>
    <div class="hint">초대가 응답될 때마다 구슬이 하나 날아와 궤도에 앉습니다 · 끌어서 공간을 돌려 보세요</div>
  </div>
  <script type="module" src="/src/proto/three-guardian.js"></script>
</body>
</html>
