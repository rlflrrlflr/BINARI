name: 반영 알림

# main 에 무언가 올라가면(=라이브 사이트가 바뀌면) 디스코드로 알린다.
#
# 왜 필요한가 (2026-09-11 신설):
#   팀원이 무언가 제보하면 우리는 진지하게 검토해서 문서로 정리한다. 그런데 그 문서가
#   개발자용 저장소에 있어서 **말한 사람은 결과를 못 본다.** 말한 사람 눈에는
#   「말했는데 아무 일도 안 일어났다」와 구분이 안 되고, 몇 번 반복되면 아무도 말을 안 하게 된다.
#   실제로 가장 무거운 유저 제보 세 건이 그렇게 처리됐다 —
#   `01_기획전략/비나리_기획전략_팀피드백트리아지_v01.md` 참조.
#
#   광고를 안 하기로 한 뒤(2026-09-10) 팀의 손이 유일한 성장 수단이 됐다.
#   그 손을 계속 움직이게 하려면 **내 말이 제품을 바꿨다는 게 눈에 보여야** 한다.
#
# 넣어야 하는 값: DISCORD_WEBHOOK_URL — 이미 있다(아침 지표와 같은 값)
#
# ⚠ 커밋 메시지를 그대로 쏟지 않는다. 이 저장소 커밋 메시지는 다음 세션이 읽는 글이라
#   길고 개발자용이다. 첫 줄만 싣고 나머지는 링크로 미룬다.

on:
  push:
    branches: [main]
  workflow_dispatch:          # 연결만 확인하고 싶을 때 손으로 돌린다

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4
        with:
          fetch-depth: 20     # 한 번에 여러 판이 올라가도 다 읽히게

      - name: 무엇이 바뀌었나 알리기
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          SITE: https://binari-sepia.vercel.app
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # ⚠ 보내는 건 app/tools/discord-post.py 한 곳에서만 한다.
          #    직접 보내면 User-Agent 를 빠뜨려 403 이 난다 — 2026-07-28·09-14 두 번 겪었다.
          python3 - <<'PY' | python3 app/tools/discord-post.py
          import os, re, subprocess

          def sh(*a):
              try:
                  return subprocess.run(a, capture_output=True, text=True, timeout=30).stdout.strip()
              except Exception:
                  return ""

          before  = os.environ.get("BEFORE", "")
          after   = os.environ.get("AFTER", "")
          manual  = bool(os.environ.get("MANUAL"))
          repo    = os.environ["REPO_URL"]
          # 손으로 돌린 판에는 before 가 없다. 그대로 쓰면 `compare/...abc` 같은 깨진 주소가 나간다
          # (실제로 나갔다 — 2026-09-14). 없으면 그 커밋 한 건만 본다.
          has_range = bool(before) and not before.startswith("0000")
          rng = f"{before}..{after}" if has_range else ""

          bodies = sh("git", "log", "--format=%B%x00", rng) if rng else sh("git", "log", "-1", "--format=%B%x00")
          msgs = [m.strip() for m in bodies.split("\0") if m.strip()]

          # ── 팀에게 보일 문장은 커밋 제목이 아니라 「팀알림:」 줄에서 가져온다 ──────────
          # ⚠ 2026-09-14 실사고: 커밋 제목을 그대로 실었더니 디스코드에
          #   「반영 알림이 네 번 조용히 실패하고 있었다 — 403, 그리고 세 번째 같은 교훈」이 떴다.
          #   이 저장소의 커밋 메시지는 **다음 세션이 읽는 글**이라 팀에게는 무슨 소린지 모른다.
          #   알림을 만든 이유가 「팀이 자기 말의 결과를 알게 하는 것」인데 정반대가 됐다.
          #   → 사람이 팀에게 하고 싶은 말은 커밋에 `팀알림: ...` 한 줄로 적는다.
          #     없으면 **아무 말도 지어내지 않는다** — 개발자 문장을 흘리느니 조용한 게 낫다.
          notes = []
          for m in msgs:
              for line in m.splitlines():
                  mt = re.match(r"^\s*팀알림\s*[:：]\s*(.+)$", line)
                  if mt:
                      notes.append(mt.group(1).strip())

          files = sh("git", "diff", "--name-only", rng) if rng else sh("git", "show", "--name-only", "--format=", "HEAD")
          touched = [f for f in files.splitlines() if f.strip()]

          # 세 갈래로 가른다. ⚠ 서버(app/api)를 「화면이 바뀌었어요」로 부르면 안 된다 —
          #   보러 가도 달라진 게 없어서 **알림을 안 믿게 된다**(실제로 그렇게 나갔다).
          screen = any(f.startswith(("app/src/", "app/public/")) for f in touched)
          inside = any(f.startswith(("app/api/", "app/tools/", ".github/")) for f in touched)

          if screen:
              head = "**앱 화면이 바뀌었어요**"
          elif inside:
              head = "**안쪽을 손봤어요** — 화면은 그대로예요"
          else:
              head = "**기록만 바뀌었어요** — 화면은 그대로예요"

          # ⚠ 주소를 날것으로 적지 마라 (2026-09-14 창업자: "URL은 그냥 하이퍼링크로 달아줘 너무 길어").
          #   40자짜리 커밋 해시 두 개가 그대로 보이면 정작 읽어야 할 한 줄이 안 보인다.
          #   디스코드는 웹훅 본문에서도 [글자](주소) 를 링크로 그려 준다 — 카드도 안 붙는다.
          link = f"{repo}/compare/{before}...{after}" if has_range else f"{repo}/commit/{after}"
          foot = [f"[뭐가 바뀌었나]({link})"]
          if screen:
              foot.insert(0, f"[지금 보기]({os.environ['SITE']})")

          out = [("🧪 " if manual else "") + head]
          out += [f"· {n}" for n in notes[:4]]
          out.append(" · ".join(foot))
          print("\n".join(out))
          PY
