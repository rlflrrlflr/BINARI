name: 디스코드 명령 등록

# `/시켜` 슬래시 명령을 디스코드에 한 번 등록한다. **설정할 때 한 번만 돌리면 된다.**
#
# 왜 이걸 워크플로로 만들었나 (2026-09-11 신설):
#   디스코드 개발자 화면에는 슬래시 명령을 만드는 버튼이 없다. API 를 직접 불러야 하는데,
#   그러면 창업자가 터미널을 열고 봇 토큰을 손으로 다뤄야 한다 —
#   **설정 전체에서 제일 걸리는 단계였다.** 깃허브는 디스코드에 접속할 수 있으므로 여기서 대신 부른다.
#   브라우저에서 버튼 한 번 누르는 일로 바뀐다.
#
# 넣어야 하는 값 (저장소 Settings → Secrets and variables → Actions):
#   DISCORD_BOT_TOKEN  — 디스코드 개발자 화면 → Bot → Reset Token 으로 받는 값
#
# 쓰는 법: 저장소 위쪽 Actions 탭 → 왼쪽에서 '디스코드 명령 등록' → 오른쪽 'Run workflow'
#          → Application ID 를 넣고 실행.
#
# ⚠ 봇 토큰은 **비밀값으로만** 넣는다. 입력칸(inputs)에 넣으면 실행 기록에 그대로 남는다.

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Application ID (디스코드 개발자 화면 → General Information)"
        required: true
      command:
        description: "명령 이름 (앞의 / 는 빼고)"
        default: "시켜"
      scope:
        description: "어디에 등록할까 — global 은 퍼지는 데 최대 1시간, guild 는 즉시"
        type: choice
        default: global
        options: [global, guild]
      guild_id:
        description: "scope 가 guild 일 때만 — 서버 ID (서버 이름 우클릭 → 서버 ID 복사)"
        required: false

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - name: 명령 등록
        env:
          BOT: ${{ secrets.DISCORD_BOT_TOKEN }}
          APP_ID: ${{ inputs.app_id }}
          CMD: ${{ inputs.command }}
          SCOPE: ${{ inputs.scope }}
          GUILD: ${{ inputs.guild_id }}
        run: |
          if [ -z "$BOT" ]; then
            echo "::error::DISCORD_BOT_TOKEN 이 없다. 저장소 Settings → Secrets and variables → Actions 에 먼저 넣어라."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error

          app   = os.environ["APP_ID"].strip()
          bot   = os.environ["BOT"].strip()
          name  = (os.environ.get("CMD") or "시켜").strip().lstrip("/")
          scope = os.environ.get("SCOPE", "global")
          guild = (os.environ.get("GUILD") or "").strip()

          if scope == "guild" and not guild:
              print("::error::scope 를 guild 로 골랐으면 guild_id 가 필요하다.")
              sys.exit(1)

          url = (f"https://discord.com/api/v10/applications/{app}/guilds/{guild}/commands"
                 if scope == "guild" else
                 f"https://discord.com/api/v10/applications/{app}/commands")

          body = {
              "name": name,
              "description": "클로드에게 작업을 시킨다",
              "options": [{
                  "name": "일",
                  "description": "무엇을 해야 하나",
                  "type": 3,          # 3 = 글자
                  "required": True,
              }],
          }

          # ⚠ **User-Agent 를 반드시 보낸다.** 없으면 디스코드 앞단(Cloudflare)이 막고
          #   `403 error code: 1010` 을 준다 — API 오류가 아니라 **차단 페이지**다.
          #   2026-07-28 아침 지표, 09-14 반영 알림에 이어 **여기서 세 번째로 같은 함정**을 밟았다.
          #   1010 은 「권한 없음」이 아니다. 그렇게 읽으면 봇 초대·앱 ID 를 엉뚱하게 뒤지게 된다(실제로 그랬다).
          req = urllib.request.Request(
              url, data=json.dumps(body).encode(), method="POST",
              headers={
                  "Authorization": f"Bot {bot}",
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://binari-sepia.vercel.app, 1.0)",
              })
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  out = json.loads(r.read())
              print(f"등록했다 — /{out.get('name')} (id={out.get('id')})")
              if scope == "global":
                  print("전체 등록이라 디스코드에 보이기까지 최대 1시간 걸린다. 바로 쓰고 싶으면 scope=guild 로 다시 돌려라.")
          except urllib.error.HTTPError as e:
              detail = e.read().decode(errors="replace")[:400]
              # ⚠ 토큰은 절대 찍지 않는다 — 실행 기록은 저장소를 볼 수 있는 사람이 다 본다.
              print(f"::error::디스코드가 거절했다 ({e.code}). {detail}")
              # ⚠ 403 을 무조건 「권한 없음」으로 읽지 마라. 디스코드 앞단(Cloudflare)이 막은 것도 403 이고,
              #   그 둘은 고치는 방법이 정반대다. 가르는 기준은 **본문 모양**이다 —
              #   진짜 API 오류는 JSON({"code": 50001, ...}), 차단은 `error code: 1010` 같은 맨 글자다.
              if "error code:" in detail or "cloudflare" in detail.lower():
                  print("::error::권한 문제가 아니다 — 디스코드 앞단이 막았다(대개 User-Agent 누락). 봇 초대나 앱 ID 를 뒤지지 마라.")
              elif e.code == 401:
                  print("::error::봇 토큰이 틀렸거나 만료됐다. 개발자 화면에서 Reset Token 으로 새로 받아 비밀값을 갱신해라.")
              elif e.code == 403:
                  print("::error::이 앱에 대한 권한이 없다. Application ID 가 그 봇의 것이 맞는지 확인해라.")
              sys.exit(1)
          PY
