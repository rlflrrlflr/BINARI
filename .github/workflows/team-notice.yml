name: 팀 공지

# main 에 [팀] 표시가 붙은 커밋이 올라오면 즉시 디스코드로 알린다.
# 표시 없는 커밋은 아무것도 보내지 않는다 — 매일 아침 리포트의 '어제 반영된 것'으로만 나간다.
#
# ⚠️ 왜 전부 알리지 않는가
#    2026-07-28 하루에 main 커밋이 38건 들어왔다(머지 9 · 앱 15 · 문서·도구 14).
#    전부 알리면 사흘이면 채널을 뮤트하게 되고, 그러면 판결 실패·앱 오류 알림까지 함께 묻힌다.
#    알림이 울리면 "봐야 한다"는 뜻으로 남기려면 울리는 횟수를 지켜야 한다.
#
# ⚠️ [팀] 을 언제 붙이나 — 셋을 모두 만족할 때만 (자세한 기준은 app/유지보수_규칙.md)
#    ① 팀원이 앱을 써보다가 느낄 수 있는 변화인가
#    ② 자동 검사(검진·스모크)로는 확인되지 않는가
#    ③ 아침까지 기다리지 말고 지금 확인받아야 하는가

on:
  push:
    branches: [main]

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: '[팀] 커밋 추리기'
        id: pick
        env:
          # 커밋 메시지는 사람이 쓴 값이라 셸에 직접 펼치지 않는다(따옴표·역따옴표 사고 방지)
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          items = json.loads(os.environ.get("COMMITS") or "[]")
          picked = []
          for c in items:
              head = (c.get("message") or "").strip().splitlines()
              if not head:
                  continue
              title = head[0].strip()
              if not title.startswith("[팀]"):
                  continue
              body = "\n".join(l.strip() for l in head[1:] if l.strip())[:300]
              picked.append({"title": title[3:].strip(), "body": body, "url": c.get("url", "")})
          print("count=%d" % len(picked))
          print("payload<<EOF")
          print(json.dumps(picked, ensure_ascii=False))
          print("EOF")
          PY

      - name: 디스코드로 보내기
        if: steps.pick.outputs.count != '0'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAYLOAD: ${{ steps.pick.outputs.payload }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL 이 없습니다. 저장소 Settings > Secrets 에 넣어주세요."
            exit 1
          fi
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          items = json.loads(os.environ["PAYLOAD"])
          lines = ["📣 **앱이 방금 바뀌었습니다** — 확인 부탁드려요!", ""]
          for it in items:
              lines.append(f"**{it['title']}**")
              if it["body"]:
                  lines.append(it["body"])
              lines.append("")
          lines.append("https://binari-sepia.vercel.app/")
          text = "\n".join(lines)[:1900]
          req = urllib.request.Request(
              os.environ["DISCORD_WEBHOOK_URL"],
              data=json.dumps({"content": text, "allowed_mentions": {"parse": []}}).encode(),
              headers={"Content-Type": "application/json",
                       # 기본 User-Agent 는 Cloudflare 가 막는다(403 · error 1010). 지우지 말 것.
                       "User-Agent": "DiscordBot (https://binari-sepia.vercel.app, 1.0)"})
          try:
              urllib.request.urlopen(req, timeout=30)
              print("발송 완료:", len(items), "건")
          except urllib.error.HTTPError as e:
              raise SystemExit(f"디스코드 발송 실패 ({e.code}): {e.read().decode('utf-8','ignore')[:200]}")
          PY
